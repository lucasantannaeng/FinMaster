name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: TypeCheck, Lint & Tests
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: "https://placeholder-finmaster.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder-anon-key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest Suite
        run: npm test

      - name: Build Production Bundle
        run: npm run build
